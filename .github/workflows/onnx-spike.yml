name: ONNX spike

on:
  push:
    branches: [feat/onnx-spike-and-local-embedder]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo run --release
        working-directory: spikes/onnx

  musl:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: >
          docker run --rm -v "$PWD:/work" -w /work/spikes/onnx rust:alpine
          sh -c "apk add --no-cache build-base && cargo run --release"

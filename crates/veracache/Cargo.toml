[package]
name = "veracache"
description = "Correctness-first semantic cache for LLMs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["local"]
local = ["veracache-embed/local"]

[dependencies]
veracache-core.workspace = true
veracache-embed.workspace = true
veracache-guard.workspace = true
veracache-store.workspace = true

[dev-dependencies]
async-trait.workspace = true
criterion.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "paraphrase"
required-features = ["local"]

[[bench]]
name = "lookup"
harness = false
